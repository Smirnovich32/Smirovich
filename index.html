<style id="app-css">
/* Gallery wall: grey ground, white rounded cards, serif display + clean sans. Single deliberate light look. */
:root{
  --bg:#d6d5d2; --bg-2:#cbcac6; --card:#fff; --ink:#151515; --ink-2:#5c5c5a; --ink-3:#8f8e8a;
  --line:#e6e5e1; --soft:#f4f3f0; --sale:#a8473a; --ok:#4f7f55;
  --serif:"Cormorant",Georgia,"Times New Roman",serif; --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px; --r-sm:14px; --gap:16px; --pad:clamp(20px,2.8vw,44px);
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{background:var(--bg);color:var(--ink);font:400 15px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.wrap{max-width:3200px;margin:0 auto;padding-inline:16px}
@media(min-width:700px){.wrap{padding-inline:clamp(28px,2.2vw,64px)}}
.card{background:var(--card);border-radius:var(--r);overflow:hidden}
.eyebrow{font:500 11px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--ink-3)}
.h2{font:400 clamp(38px,5vw,68px)/1 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.h2 em{font-style:italic;color:var(--ink-2)}
.lead{font:400 clamp(19px,1.7vw,23px)/1.5 var(--serif);color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;gap:12px;padding:16px 28px;border:1px solid var(--ink);border-radius:999px;font:500 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;transition:background .3s,color .3s,transform .3s var(--ease)}
.btn:hover{background:var(--ink);color:var(--card);transform:translateY(-2px)}
.btn.dark{background:var(--ink);color:var(--card)}
.btn.dark:hover{background:#333}
.btn svg{width:14px;height:14px;transition:transform .3s var(--ease)}
.btn:hover svg{transform:translateX(4px)}
.btn[disabled]{opacity:.45;pointer-events:none}
section{padding-block:var(--gap)}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px;padding:var(--pad)}
.sec-head .eyebrow{margin-bottom:18px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;padding-block:12px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px)}
.nav .card{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px 12px 24px;border-radius:999px;overflow:visible}
.logo{font:600 15px/1 var(--sans);letter-spacing:.38em}
.logo{display:flex;align-items:center;gap:12px}
.logo .mark{width:40px;height:40px;flex:none;transition:transform .5s var(--ease)}
.logo .mark svg{width:100%;height:100%;display:block}
.logo:hover .mark{transform:rotate(-14deg) scale(1.06)}
@media(max-width:480px){.nav .card{padding:8px 8px 8px 12px;gap:8px}.logo{gap:9px}.logo .mark{width:34px;height:34px}.logo>span:last-child{letter-spacing:.16em;font-size:13px}.logo small{display:none}.nav .btn{padding:10px 12px;letter-spacing:.1em}.burger{width:38px;height:38px}}
.logo small{display:block;font:italic 400 14px/1 var(--serif);letter-spacing:.02em;color:var(--ink-3);margin-top:5px}
.nav ul{display:flex;gap:26px;list-style:none}
.nav ul a{font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);transition:.2s;position:relative}
.nav ul a::after{content:"";position:absolute;left:0;right:100%;bottom:-6px;height:1px;background:var(--ink);transition:right .35s var(--ease)}
.nav ul a:hover{color:var(--ink)}
.nav ul a:hover::after{right:0}
.nav-actions{display:flex;gap:8px}
.nav .btn{padding:12px 18px}
.m-only{display:none}
.burger{display:none;width:44px;height:44px;align-items:center;justify-content:center;border-radius:50%}
@media(max-width:1120px){
  .nav ul{display:none;position:absolute;top:calc(100% - 2px);left:16px;right:16px;flex-direction:column;gap:0;background:var(--card);padding:10px 24px;border-radius:var(--r);box-shadow:0 20px 40px -20px rgba(0,0,0,.3)}
  .nav ul.open{display:flex;animation:rise .35s var(--ease)}
  .nav ul li a{display:block;padding:14px 0;border-bottom:1px solid var(--line)}
  .nav ul li:last-child a{border:0}
  .burger{display:flex}
}
@media(max-width:640px){.nav .btn.ghost{display:none}.m-only{display:block}.nav .btn{padding:11px 14px;letter-spacing:.14em}}

/* hero / author */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:var(--gap)}
.hero-text{padding:var(--pad);display:flex;flex-direction:column;justify-content:space-between;gap:36px;min-height:min(70vh,680px)}
.hero h1{font:italic 400 clamp(56px,8vw,124px)/.95 var(--serif);letter-spacing:-.02em;margin:18px 0 20px;overflow:hidden;color:var(--ink-2)}
.hero h1 span{display:inline-block;animation:lineUp 1.1s var(--ease) both}
.hero .lead{max-width:520px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);padding-top:26px;gap:12px}
.stats b{display:block;font:400 40px/1 var(--serif);font-variant-numeric:tabular-nums}
.stats.contact-stats{display:flex;flex-wrap:wrap;gap:20px 48px}
.contact-stats a,.contact-stats button{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.contact-stats b{font-size:clamp(22px,2.4vw,32px);white-space:nowrap;transition:color .25s}
.contact-stats a:hover b,.contact-stats button:hover b{color:var(--ink-2)}
.stats span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.hero-img{position:relative;min-height:440px;background:#efefed}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);animation:kenburns 18s ease-out both}
.hero-img figcaption{position:absolute;left:28px;bottom:26px;right:28px;display:flex;justify-content:space-between;align-items:end;font:italic 400 17px/1.3 var(--serif);color:var(--ink-2)}
.hero-sign{font:italic 400 34px/1 var(--serif);color:var(--ink)}
.intro>*{animation:rise 1s var(--ease) both}
.intro>*:nth-child(2){animation-delay:.1s}.intro>*:nth-child(3){animation-delay:.25s}.intro>*:nth-child(4){animation-delay:.4s}
@media(max-width:900px){.hero{grid-template-columns:1fr}.hero-text{min-height:0}.stats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:24px}}

.statement{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);margin-top:var(--gap)}
.statement .card{padding:clamp(22px,2vw,30px);transition:transform .5s var(--ease),box-shadow .5s}
.statement .card:hover{transform:translateY(-6px);box-shadow:0 26px 50px -30px rgba(0,0,0,.35)}
.statement .num{font:italic 400 15px/1 var(--serif);color:var(--ink-3)}
.statement h3{font:500 25px/1.15 var(--serif);margin:10px 0 8px}
.statement p{color:var(--ink-2);font-size:14px}
@media(max-width:900px){.statement{grid-template-columns:1fr}}

.marquee{position:relative;margin-top:var(--gap);padding-block:22px;overflow:hidden;white-space:nowrap;border-radius:999px;background:var(--ink);color:var(--card);touch-action:pan-y;user-select:none}
.marquee.drag{cursor:grabbing!important}
.mq-track{display:inline-flex;will-change:transform}
.marquee .mq{display:inline-flex;gap:48px;padding-right:48px;font:italic 400 28px/1 var(--serif)}
.mq-nav{position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.7);transition:opacity .25s,transform .3s var(--ease);box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.mq-nav svg{width:15px;height:15px}
.mq-nav.prev{left:10px}.mq-nav.next{right:10px}
.marquee:hover .mq-nav,.mq-nav:focus-visible{opacity:1;transform:none}
@media(hover:none){.mq-nav{display:none}}
.marquee span{display:inline-flex;align-items:center;gap:48px}
.marquee span::after{content:"✦";font:400 12px/1 var(--sans);opacity:.5}

/* carousels */
.car-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:20px;padding:var(--pad)}
.car-head .eyebrow{margin-bottom:18px}
.car-nav{display:flex;align-items:center;gap:10px}
.car-nav button{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:.3s var(--ease)}
.car-nav button:hover{background:var(--ink);border-color:var(--ink);color:var(--card);transform:scale(1.06)}
.car-nav svg{width:16px;height:16px}
.car-prog{width:120px;height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin-right:10px}
.car-prog i{display:block;height:100%;width:30%;background:var(--ink);border-radius:2px;transition:transform .4s var(--ease)}
.car-box{display:flex;flex-direction:column}
.car-box .car-head{padding:clamp(20px,2.2vw,34px) clamp(20px,2.6vw,40px) 0;align-items:center}
.car-box .car-head .eyebrow{margin-bottom:10px}
.car-box .h2{font-size:clamp(32px,3.4vw,58px)}
.car-box .track{margin-top:0;padding:clamp(16px,1.8vw,24px) clamp(20px,2.6vw,40px) clamp(20px,2.6vw,40px);scroll-padding-inline:clamp(20px,2.6vw,40px)}
.car-box .slide{border:1px solid var(--line)}
/* the whole block (title + cards + captions) fits one screen under the header */
.car-box{--si:clamp(170px,calc(100svh - 475px),640px)}
.car-box .slide .img{aspect-ratio:auto;height:var(--si);padding:clamp(14px,2vw,32px)}
.car-box .track{grid-auto-columns:min(calc(var(--si) * .82 + 18px),82%)}
/* phones: the cards run edge to edge of the screen; the title keeps its own card */
@media(max-width:640px){
  .car-box{background:transparent;overflow:visible;border-radius:0;box-shadow:none}
  .car-box .car-head{background:var(--card);border-radius:var(--r);padding:16px 18px}
  .car-box .track{margin-inline:-16px;padding:12px 16px 8px;scroll-padding-inline:16px;grid-auto-columns:min(calc(var(--si) * .82 + 18px),80%)}
  .car-box .slide{border:0}
}
.car-box .slide:hover{box-shadow:0 24px 40px -28px rgba(0,0,0,.35)}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(270px,31%,440px);gap:var(--gap);overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scroll-behavior:smooth;margin-top:var(--gap);padding-bottom:6px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{scroll-snap-align:start;scroll-snap-stop:always;cursor:pointer;display:flex;flex-direction:column;position:relative;transition:transform .5s var(--ease),box-shadow .5s}
.slide:hover{transform:translateY(-6px);box-shadow:0 30px 50px -30px rgba(0,0,0,.4)}
.slide .img{aspect-ratio:4/5;max-width:100%;background:var(--soft);display:flex;align-items:center;justify-content:center;padding:clamp(22px,3vw,40px);overflow:hidden;margin:8px;border-radius:var(--r-sm)}
.slide img{max-height:100%;object-fit:contain;box-shadow:0 18px 36px -18px rgba(0,0,0,.5);transition:transform .9s var(--ease)}
.slide:hover img{transform:scale(1.06)}
/* touch screens: no hover lift (it sticks after a tap and makes swiping jittery) */
@media(hover:none){.slide:hover,.work:hover,.coll:hover{transform:none;box-shadow:none}.slide:hover img,.work:hover img,.coll:hover .covers img{transform:none}.track{-webkit-overflow-scrolling:touch}}
.slide .meta{padding:14px 24px 24px;display:flex;flex-direction:column;gap:4px;flex:1}
.slide h3{font:500 24px/1.1 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slide .sub{font-size:12px;color:var(--ink-3)}
.slide .foot{display:flex;justify-content:space-between;align-items:baseline;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.slide .rank{font:italic 400 18px/1 var(--serif);color:var(--ink-3)}
.empty{padding:40px var(--pad);color:var(--ink-3);font:italic 400 20px/1.4 var(--serif)}
@media(max-width:640px){.track{grid-auto-columns:82%;--gap:12px}.car-prog{display:none}}

.pr{display:inline-flex;align-items:baseline;gap:8px;font:600 20px/1 var(--sans);letter-spacing:-.01em;color:var(--ink);white-space:nowrap;font-variant-numeric:lining-nums tabular-nums}
.pr .cur{font-weight:500;color:var(--ink-2);margin-right:1px}
.pr s{font-size:.7em;font-weight:500;color:var(--ink-3);text-decoration-thickness:1px}
.pr.sale{color:var(--sale)}
.pr.sale .cur{color:var(--sale)}
.pr.sold{font:600 11px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);padding:7px 10px;border:1px solid var(--line);border-radius:999px}
.pr.ask{font-size:14px;font-weight:500;color:var(--ink-2)}
.badge{position:absolute;top:22px;left:22px;z-index:2;font:600 10px/1 var(--sans);letter-spacing:.18em;text-transform:uppercase;background:var(--card);padding:9px 12px;border-radius:999px;box-shadow:0 6px 16px -8px rgba(0,0,0,.3)}
.badge.sold{background:var(--ink);color:var(--card)}
.badge.sale{background:var(--sale);color:var(--card)}

/* collections */
.coll-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);margin-top:var(--gap)}
.coll{cursor:pointer;display:flex;flex-direction:column;transition:transform .5s var(--ease),box-shadow .5s}
.coll:hover{transform:translateY(-6px);box-shadow:0 30px 50px -30px rgba(0,0,0,.4)}
.coll .covers{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:6px;aspect-ratio:16/10;max-width:100%;padding:8px 8px 0}
.coll .covers div{overflow:hidden;border-radius:var(--r-sm);background:var(--soft)}
.coll .covers div:first-child{grid-row:span 2}
.coll .covers img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.coll:hover .covers img{transform:scale(1.07)}
.coll .body{padding:18px 22px 22px;display:flex;flex-direction:column;gap:8px;flex:1}
.coll .count{font:italic 400 15px/1 var(--serif);color:var(--ink-3)}
.coll h3{font:500 30px/1.05 var(--serif)}
.coll p{color:var(--ink-2);font-size:14px;flex:1}
.coll .more{font:500 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-top:8px}
.coll .more i{display:block;height:1px;width:28px;background:currentColor;transition:width .4s var(--ease)}
.coll:hover .more i{width:56px}
.coll.portfolio{background:var(--ink);color:var(--card);justify-content:space-between;padding:24px}
.coll.portfolio p{color:#bdbcb8;flex:0}
.coll.portfolio .big{font:italic 400 clamp(60px,7vw,96px)/.9 var(--serif)}
@media(max-width:1020px){.coll-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.coll-grid{grid-template-columns:1fr}}

/* work in progress */
.wip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--gap);margin-top:var(--gap)}
.wip .card{padding:var(--pad);display:flex;flex-direction:column;gap:14px;transition:transform .5s var(--ease),box-shadow .5s}
.wip .card:hover{transform:translateY(-6px);box-shadow:0 26px 50px -30px rgba(0,0,0,.35)}
.wip h3{font:400 clamp(30px,2.6vw,46px)/1.05 var(--serif);text-wrap:balance}
.wip p{color:var(--ink-2);font-size:14px}
.wip .formula{font:italic 400 clamp(19px,1.5vw,24px)/1.4 var(--serif);color:var(--ink);border-left:1px solid var(--ink);padding-left:16px}
.wip .tag{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font:600 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--line);padding:8px 12px;border-radius:999px}

/* catalogue */
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:0 var(--pad) calc(var(--pad) * .8)}
.filters button{padding:11px 18px;border:1px solid var(--line);font:500 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);transition:.25s;border-radius:40px}

.filters button.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.filters sup{font-size:9px;margin-left:4px;opacity:.6}
.cat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap);margin-top:var(--gap)}
.work{cursor:pointer;position:relative;display:flex;flex-direction:column;transition:transform .5s var(--ease),box-shadow .5s}
.work:hover{transform:translateY(-5px);box-shadow:0 26px 44px -28px rgba(0,0,0,.4)}
.work .img{aspect-ratio:1;max-width:100%;background:var(--soft);display:flex;align-items:center;justify-content:center;padding:22px;overflow:hidden;margin:6px;border-radius:var(--r-sm)}
.work img{max-height:100%;object-fit:contain;box-shadow:0 12px 26px -14px rgba(0,0,0,.5);transition:transform .8s var(--ease)}
.work:hover img{transform:scale(1.06)}
.work .meta{padding:12px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.wl{color:inherit;text-decoration:none}
.work h4{font:500 20px/1.15 var(--serif);overflow-wrap:break-word;hyphens:auto}
.work .sub{font-size:12px;color:var(--ink-3)}
.work .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:12px}
.work .pr{font-size:18px}
.st{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:10px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.st.sold::before{background:#b44}
.st.res::before{background:#c9a24a}
.work .badge{top:16px;left:16px}
@media(max-width:1100px){.cat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.cat-grid{grid-template-columns:repeat(2,minmax(0,1fr));--gap:12px}.work .img{padding:16px}.work .row{flex-direction:column;align-items:flex-start;gap:6px}.work .meta{padding:10px 12px 14px}}
.work.hide{display:none}

/* cv */
.cv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:var(--gap);margin-top:var(--gap)}
.cv .card{padding:var(--pad)}
.tl{list-style:none}
.tl li{display:grid;grid-template-columns:140px 1fr;gap:20px;padding-block:14px;border-bottom:1px solid var(--line)}
.tl li:first-child{padding-top:0}
.tl li:last-child{border:0}
.tl time{font:italic 400 20px/1.2 var(--serif);color:var(--ink-3)}
.tl b{display:block;font:500 22px/1.2 var(--serif)}
.tl span{font-size:13px;color:var(--ink-2)}
@media(max-width:900px){.cv{grid-template-columns:1fr}.tl li{grid-template-columns:1fr;gap:4px}}

/* buy */
.buy{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);margin-top:var(--gap)}
.buy .card{padding:var(--pad)}
.steps{list-style:none;counter-reset:s;margin-top:20px}
.steps li{counter-increment:s;display:grid;grid-template-columns:56px 1fr;padding-block:13px;border-top:1px solid var(--line)}
.steps li::before{content:"0" counter(s);font:italic 400 26px/1 var(--serif);color:var(--ink-3)}
.steps b{display:block;font:500 20px/1.2 var(--serif);margin-bottom:4px}
.steps span{font-size:14px;color:var(--ink-2)}
.cta{background:var(--ink)!important;color:var(--card);display:flex;flex-direction:column;justify-content:space-between;gap:28px}
.cta .eyebrow{color:#9d9c98}
.cta .h2 em{color:#bdbcb8}
.cta p{color:#bdbcb8;max-width:440px}
.cta .btn{border-color:var(--card);color:var(--ink);background:var(--card);align-self:flex-start}
.cta .btn:hover{background:transparent;color:var(--card)}
.cta .btn.line{background:transparent;color:var(--card)}
.cta .btn.line:hover{background:var(--card);color:var(--ink)}
.contacts{display:flex;flex-wrap:wrap;gap:12px 28px;font-size:14px}
.contacts a,.contacts span{border-bottom:1px solid currentColor;opacity:.85}
.contacts span{user-select:all}
@media(max-width:900px){.buy{grid-template-columns:1fr}}

footer{padding-block:24px 40px}
@media(max-width:900px){footer.wrap .card{border-radius:var(--r);flex-direction:column;align-items:flex-start;gap:10px}footer{padding-bottom:96px}}
footer .card{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px;padding:30px var(--pad);font-size:12px;color:var(--ink-3);border-radius:999px}
.big-name{font:400 clamp(56px,14vw,220px)/1.05 var(--serif);letter-spacing:-.03em;text-align:center;color:var(--bg-2);padding-block:10px 4px;user-select:none;white-space:nowrap}

/* dialogs */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;color:var(--ink)}
dialog{overscroll-behavior:contain}
dialog::backdrop{background:rgba(30,30,29,.72);backdrop-filter:blur(8px)}
dialog[open]{display:flex;align-items:center;justify-content:center;animation:fade .35s ease}
.x{position:absolute;top:14px;right:14px;z-index:3;width:46px;height:46px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;transition:.3s var(--ease);box-shadow:0 6px 18px -8px rgba(0,0,0,.3)}
.x:hover{background:var(--ink);color:var(--card);transform:rotate(90deg)}
.x svg{width:16px;height:16px}
.pop{position:relative;background:var(--card);border-radius:var(--r);overflow:hidden;animation:pop .5s var(--ease)}

.wv{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);width:min(1320px,calc(100% - 32px));height:min(860px,calc(100% - 32px))}
.wv .stage{position:relative;background:var(--soft);display:flex;align-items:center;justify-content:center;padding:clamp(24px,5vw,72px);overflow:hidden;margin:10px;border-radius:var(--r-sm)}
.wv .stage img{max-height:100%;max-width:100%;object-fit:contain;box-shadow:0 30px 60px -24px rgba(0,0,0,.5);animation:imgIn .6s var(--ease)}
.wv .arrows{position:absolute;bottom:20px;left:20px;display:flex;gap:8px;z-index:2}
.wv .arrows button{width:46px;height:46px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;transition:.25s}
.wv .arrows button:hover{background:var(--ink);color:var(--card)}
.wv .arrows svg{width:16px;height:16px}
.wv .counter{position:absolute;bottom:34px;right:24px;font:italic 400 16px/1 var(--serif);color:var(--ink-3)}
.wv .info{padding:clamp(28px,4vw,56px) clamp(24px,3.4vw,48px);overflow:auto;display:flex;flex-direction:column;gap:22px;min-width:0}
.wv .info>*{animation:rise .6s var(--ease) both}
.wv .info>*:nth-child(2){animation-delay:.05s}.wv .info>*:nth-child(3){animation-delay:.1s}.wv .info>*:nth-child(4){animation-delay:.15s}.wv .info>*:nth-child(5){animation-delay:.2s}.wv .info>*:nth-child(6){animation-delay:.25s}.wv .info>*:nth-child(7){animation-delay:.3s}.wv .info>*:nth-child(8){animation-delay:.35s}
.wv .info h2{font:400 clamp(34px,3.4vw,52px)/1 var(--serif);letter-spacing:-.01em;text-wrap:balance}
.wv .info .desc{font:400 19px/1.55 var(--serif);color:var(--ink-2);white-space:pre-line}
.recs{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:12px}
.recs-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rec{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.rec .ri{aspect-ratio:1;max-width:100%;background:var(--soft);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden}
.rec img{max-height:100%;object-fit:contain;box-shadow:0 6px 12px -6px rgba(0,0,0,.4);transition:transform .5s var(--ease)}
.rec:hover img{transform:scale(1.08)}
.rec b{font:500 14px/1.15 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec span{font-size:11px;color:var(--ink-3)}
@media(max-width:560px){.recs-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.spec{border-top:1px solid var(--line)}
.spec div{display:flex;justify-content:space-between;gap:20px;padding-block:13px;border-bottom:1px solid var(--line);font-size:13px}
.spec dt{color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.spec dd{text-align:right}
.price{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:6px}
.price .pr{font-size:clamp(28px,2.4vw,38px);letter-spacing:-.02em}
.wv .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}
.wv .note{font-size:12px;color:var(--ink-3);display:flex;gap:10px;align-items:center}
.wv .note::before{content:"";width:18px;height:1px;background:var(--ink-3)}
@media(max-width:900px){
  dialog[open]{align-items:stretch}
  .wv{grid-template-columns:1fr;height:auto;width:100%;min-height:100%;overflow:auto;border-radius:0}
  .wv .stage{height:58vh}
  .wv .info{overflow:visible}
}

.cv-dlg{width:min(1180px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto}
.cv-dlg header{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;padding:clamp(28px,5vw,72px);border-bottom:1px solid var(--line)}
.cv-dlg header h2{font:400 clamp(44px,5.4vw,80px)/.95 var(--serif);margin-top:18px}
.cv-dlg header .lead{align-self:end}
.cv-dlg .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:clamp(20px,4vw,56px)}

@media(max-width:900px){.cv-dlg header{grid-template-columns:1fr}.cv-dlg .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cv-dlg{width:100%;max-height:100%;border-radius:0}}

.contact-dlg{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1fr);width:min(980px,calc(100% - 32px));max-height:calc(100% - 24px);overflow:auto}
.contact-dlg .side{background:var(--ink);color:var(--card);padding:clamp(22px,2.6vw,40px);display:flex;flex-direction:column;justify-content:space-between;gap:24px;margin:10px;border-radius:var(--r-sm)}
.contact-dlg .side .h2 em{color:#bdbcb8}
.contact-dlg .side p{color:#bdbcb8}
.contact-dlg .main{padding:clamp(20px,2.6vw,40px);min-width:0}
.contact-dlg .h2{font-size:clamp(30px,3vw,48px)}
.contact-dlg form{gap:12px;margin-top:14px}
.contact-dlg label{gap:6px}
.contact-dlg input,.contact-dlg select,.contact-dlg textarea{padding:11px 14px}
.contact-dlg textarea{min-height:72px}
.contact-dlg .chosen{margin-top:12px;padding:8px}
.contact-dlg .chosen img{width:44px;height:44px}
.chosen{align-items:center;gap:14px;padding:10px;background:var(--soft);border-radius:var(--r-sm);margin-top:24px;display:flex}
.chosen img{width:56px;height:56px;object-fit:cover;border-radius:10px}
.chosen b{display:block;font:500 18px/1.2 var(--serif)}
.chosen span{font-size:12px;color:var(--ink-3)}
form{display:flex;flex-direction:column;gap:18px;margin-top:28px}
label{display:flex;flex-direction:column;gap:8px;font:500 10px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3)}
input,textarea,select{width:100%;font:400 16px/1.4 var(--sans);color:var(--ink);border:1px solid var(--line);padding:13px 16px;background:var(--soft);outline:none;border-radius:var(--r-sm);transition:border-color .2s,background .2s}
input:focus,textarea:focus,select:focus{border-color:var(--ink);background:var(--card)}
textarea{resize:vertical;min-height:96px}

@media(max-width:800px){.contact-dlg{grid-template-columns:1fr;align-content:start;width:100%;max-height:100%;border-radius:0}dialog[open]:has(.contact-dlg){align-items:stretch}
  .contact-dlg .side{padding:16px 18px;gap:10px;margin:8px 8px 0}

/* admin */
.admin-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:10px;padding:14px 20px;border-radius:999px;background:var(--ink);color:var(--card);font:500 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);animation:rise .6s var(--ease)}

.adm{width:min(1240px,calc(100% - 32px));height:calc(100% - 32px);display:flex;flex-direction:column}

.tabs button{padding:10px 16px;border-radius:999px;font:500 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}

.adm-body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);min-height:0}

.adm-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding-top:6px}

.player{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;width:min(360px,calc(100vw - 40px));animation:rise .6s var(--ease)}
.pl-bar{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px 10px 8px;border-radius:22px;background:var(--card);box-shadow:0 14px 30px -14px rgba(0,0,0,.45);overflow:hidden}
.pl-play{width:42px;height:42px;flex:none;border-radius:50%;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center;transition:transform .3s var(--ease)}

ка: смуги кольору — етапи, а лінія, що проходить крізь них, — шлях однієї людини від народження до тиші.","img":"images/lifeline-2.jpg"},{"id":"hiroshima","s":"primitive","t":"Hiroshima","m":"Холст, олія","z":"40×40 см","y":2026,"p":1200,"d":"Фіолетові дерева, схожі на вибухи, і вогняна смуга обрію. Пейзаж, у якому краса й катастрофа написані одним і тим самим мазком.","img":"images/hiroshima.jpg"},{"id":"conceptualist","s":"mixtape","t":"Концептуаліст, що втратив сенс","m":"Холст, олія","z":"80×60 см","y":2023,"p":2600,"st":"r","d":"Художник сидить між двома порожніми полотнами й дивиться у вікно. Автопортрет кризи: момент, коли метод «від ідеї до форми» зупиняється, бо ідеї немає. Можливо, найчесніша робота мікстейпу.","img":"images/conceptualist.jpg"},{"id":"robot","s":"mixtape","t":"Робот, який робить ляльок за власною подобою та поклоняється людині, бо та його створила","m":"Диптих, холст, олія","z":"80×60 та 50×60 см","y":2021,"p":4200,"d":"Диптих про ланцюг творення. Робот майструє дерев'яну ляльку, над ним — ікона з людським обличчям. На другій частині: «You will PRAY to ME!». Сатира на ієрархії творця й творіння, віру та владу.","img":"images/robot.jpg"},{"id":"dusha-1","s":"dusha","t":"Душа 1","m":"Холст, олійні фарби","z":"30×30 см","y":"2026","p":700,"d":"Темна постать на тлі стіни з вікнами, у червоній рамі полотна. Душа, що стоїть на порозі власного дому — і не впевнена, чи хоче увійти.","img":"images/dusha-1.jpg","st":"s"},{"id":"dusha-3","s":"dusha","t":"Душа 3","m":"Холст, олійні фарби","z":"30×30 см","y":2026,"p":700,"st":"s","d":"Чорна фігура з червоним серцем на тлі зигзагоподібного орнаменту. Ритм навколо — як шум світу, крізь який душа зберігає своє тепло.","img":"images/dusha-3.jpg"},{"id":"dusha-4","s":"dusha","t":"Дві душі, що прямують до раю","m":"Холст, олійні фарби","z":"30×30 см","y":2026,"p":800,"d":"Дві маленькі постаті йдуть назустріч смугастому заходу сонця. Найніжніша робота серії — про те, що навіть дорога до раю легша, коли йдеш не сам.","img":"images/dusha-4.jpg"},{"id":"dusha-5","s":"dusha","t":"Душа 4","m":"Холст, олійні фарби","z":"30×30 см","y":2026,"p":700,"sale":590,"d":"Блакитний силует, у центрі якого спалахує зірка. Момент осяяння, коли внутрішнє світло стає видимим ззовні.","img":"images/dusha-5.jpg"},{"id":"dusha-6","s":"dusha","t":"Бездушна оболонка","m":"Холст, олійні фарби","z":"30×30 см","y":2026,"p":650,"st":"s","d":"Світла, майже примарна фігура з порожнім поглядом. Антипод серії — що лишається від людини, коли душа її залишила.","img":"images/dusha-6.jpg"},{"id":"dusha-7","s":"dusha","t":"Душа 5","m":"Холст, олійні фарби","z":"30×30 см","y":2026,"p":700,"d":"Згорнута фігура в темному колі, оточена синім і червоним. Душа в стані захисту — у коконі, який водночас оберігає й ув'язнює.","img":"images/dusha-7.jpg"},{"id":"dusha-8","s":"dusha","t":"Душа","m":"Холст, олійні фарби","z":"30×30 см","y":2021,"p":900,"d":"Перша робота, з якої почалася серія. Червона постать, що світиться біля сходів, — образ душі, яка піднімається, ще не знаючи куди.","img":"images/dusha-8.jpg"},{"id":"lifeline-1","s":"lifeline","t":"Без назви","m":"Холст, олія","z":"150×150 см","y":2026,"p":3900,"d":"Спіраль, що закручується до центру. Одне життя, стиснуте в коло: кожен виток — повернення до тих самих питань на новому рівні.","img":"images/lifeline-1.jpg"},{"id":"lifeline-3","s":"lifeline","t":"Без назви","m":"Папір, пастель","z":"21×21 см","y":2026,"p":350,"sale":280,"d":"Камерна робота на папері: чорні жести й кольорові сліди, як записи пам'яті. Життя як чернетка, яку неможливо переписати.","img":"images/lifeline-3.jpg"},{"id":"lifeline-4","s":"lifeline","t":"Лабіринт","m":"Холст, олія","z":"—","y":2026,"p":600,"d":"Чорно-біла лінія, що петляє квадратним лабіринтом. Етюд до серії: шлях, який здається заплутаним зсередини і простим, якщо подивитися згори.","img":"images/lifeline-4.jpg"},{"id":"abstract-100","s":"abstract","t":"Без назви","m":"Холст, олія","z":"100×100 см","y":2026,"p":3200,"d":"Головне полотно серії. Щільне плетиво червоного, синього й охри, у якому кожен глядач бачить своє. Робота, що найкраще передає момент народження гармонії з хаосу.","img":"images/abstract-100.jpg"},{"id":"khlopushka","s":"abstract","t":"Новорічна хлопушка в коловороті лайна","m":"Холст, олія","z":"40×40 см","y":2025,"p":950,"d":"Вихор теплих темних мазків, крізь який пробиваються яскраві конфеті. Свято посеред буденності — з тією самою іронією, що й у назві.","img":"images/khlopushka.jpg"},{"id":"firmova","s":"abstract","t":"Фірмова доставка","m":"Холст, олія","z":"30×30 см","y":2025,"p":700,"sale":560,"d":"Синьо-жовта рельєфна поверхня з густими краплями фарби. Енергійна, майже скульптурна робота — фактура, яку хочеться торкнутися.","img":"images/firmova.jpg"},{"id":"newhope","s":"abstract","t":"New Hope","m":"Холст, олія","z":"30×30 см","y":2025,"p":650,"sale":520,"d":"Яскраві мазки на сонячно-жовтому тлі. Найоптимістичніша робота серії — заряд кольору для простору, якому бракує світла.","img":"images/newhope.jpg"},{"id":"newyeartree","s":"abstract","t":"New Year Tree","m":"Холст, олія","z":"30×30 см","y":2025,"p":650,"d":"Червоні спіралі на густому зеленому — ялинка, що розчинилася в абстракції. Святковий настрій без жодної прямої цитати.","img":"images/newyeartree.jpg"},{"id":"sky","s":"abstract","t":"Sky Through The Crown Of Tree","m":"Холст, пастель","z":"30×30 см","y":2025,"p":500,"sale":390,"d":"Небо, яке бачиш, лежачи під деревом: синь, що пробивається крізь листя. Легка, повітряна робота.","img":"images/sky.jpg"},{"id":"pizza","s":"abstract","t":"Піца зі спаржею","m":"Холст, олія","z":"30×30 см (тондо)","y":2025,"p":750,"d":"Кругле полотно з рельєфними завитками фарби. Гастрономічна назва перетворює абстракцію на жарт — і змушує дивитися уважніше.","img":"images/pizza.jpg"},{"id":"indigo","s":"abstract","t":"Indigo","m":"Холст, олія","z":"30×40 см","y":2025,"p":600,"sale":480,"d":"Темне, глибоке полотно з червоними й бірюзовими спалахами. Нічна робота для тих, хто любить споглядати повільно.","img":"images/indigo.jpg"},{"id":"sadside","s":"abstract","t":"Sad Side Of Heaven","m":"Холст, олія","z":"40×30 см","y":2025,"p":600,"d":"Синьо-жовті мазки в білій рамі полотна. Рай, побачений з того боку, де трохи сумно.","img":"images/sadside.jpg"},{"id":"allusion","s":"mixtape","t":"Алюзія на життя в Україні","m":"Холст, олія","z":"40×50 см","y":2024,"p":1000,"d":"М'ясорубка на чорному тлі. Жорстка й лаконічна метафора: механізм, крізь який проходить кожен. Без коментарів — назва говорить сама.","img":"images/allusion.jpg"},{"id":"pravovyi","s":"mixtape","t":"Правовий режим воєнного часу","m":"Резолюція прав людини на туалетному папері","z":"—","y":2024,"p":1500,"d":"Загальна декларація прав людини, надрукована на туалетному папері. Концептуальний об'єкт про ціну декларацій, коли реальність говорить інакше.","img":"images/pravovyi.jpg"},{"id":"duel","s":"mixtape","t":"Дуель з собою","m":"Холст, олія","z":"40×30 см","y":2021,"p":1100,"d":"Дві постаті з револьверами на пагорбі під грозовим небом — і обидві є однією людиною. Внутрішній конфлікт, перенесений у жанр вестерну.","img":"images/duel.jpg"},{"id":"equilibrium","s":"mixtape","t":"Еквілібризм по-українськи","m":"Холст, олія","z":"40×30 см","y":2021,"p":1200,"d":"Будівля парламенту з дахом-шапіто. Політична сатира: держава як цирк, у якому всі балансують, але ніхто не падає.","img":"images/equilibrium.jpg"},{"id":"war","s":"mixtape","t":"Війна в Україні триває","m":"Акварельний папір, кров","z":"30×20 см","y":2021,"p":900,"d":"Фігура на дивані перед телевізором, написана кров'ю. Дзеркальний напис «War on Ukraine keep going» — звична новина, до якої світ встиг звикнути.","img":"images/war.jpg"},{"id":"tulipberry","s":"mixtape","t":"Tulipberry","m":"Холст, олія","z":"30×40 см","y":2021,"p":800,"sale":640,"d":"Тюльпани, що виросли полуницями. Сюрреалістичний натюрморт про очікування та підміну — і просто дуже гарна річ.","img":"images/tulipberry.jpg"},{"id":"vnuk","s":"mixtape","t":"Внук людський","m":"Холст, олія","z":"40×50 см","y":2021,"p":1000,"d":"Безликий чоловік у білій сорочці — пряма алюзія на «Сина людського» Магрітта. Нове покоління, яке втратило навіть яблуко, що приховувало обличчя.","img":"images/vnuk.jpg"},{"id":"euthanasia","s":"mixtape","t":"Свята евтаназія","m":"Холст, олія","z":"30×40 см","y":2021,"p":900,"st":"s","d":"Силует смерті з косою, вирізаний із нічного неба, крізь який видно хмари. Смерть як вихід у світло — провокативна робота про право вибору.","img":"images/euthanasia.jpg"},{"id":"lugar","s":"primitive","t":"Lugar","m":"Холст, олія","z":"30×30 см","y":2026,"p":550,"sale":440,"d":"Сіро-фіолетове небо над смугою зелені. Мінімальна форма місця — пейзаж, зведений до відчуття.","img":"images/lugar.jpg"},{"id":"starry","s":"primitive","t":"Starry Night","m":"Холст, олія","z":"30×20 см","y":2026,"p":600,"d":"Діалог з Ван Гогом: густе нічне небо, вогняне сонце-місяць і жовті зорі над землею. Класичний сюжет, переказаний мовою примітиву.","img":"images/starry.jpg"},{"id":"starychi1","s":"primitive","t":"Старичі","m":"Папір, пастель","z":"18×18 см","y":2025,"p":300,"sale":240,"d":"Темний ліс і квітучий луг. Пастельний етюд з натури — тепла, тиха робота.","img":"images/starychi1.jpg"},{"id":"starychi2","s":"primitive","t":"Старичі II","m":"Папір, пастель","z":"18×18 см","y":2025,"p":300,"d":"Дорога вздовж жовтого поля до зеленої смуги лісу. Пара до першої роботи — гарно звучать разом.","img":"images/starychi2.jpg"},{"id":"clouds","s":"primitive","t":"Без назви","m":"Холст, олія","z":"30×30 см","y":2026,"p":600,"d":"Рельєфні хмари, що висять над сірою рівниною. Густа, майже скульптурна фактура олії.","img":"images/clouds.jpg"},{"id":"tree","s":"primitive","t":"Без назви","m":"Холст, олія","z":"30×30 см","y":2026,"p":600,"d":"Темне дерево і гілка рельєфного білого цвіту. Весна, яка приходить навіть уночі.","img":"images/tree.jpg"},{"id":"oldtown","s":"primitive","t":"Old Town","m":"Папір, пастель","z":"21×21 см","y":2026,"p":350,"sale":280,"d":"Старе місто з дзвіницею під важким небом, в насиченій червоній рамі. Спогад про місце, а не його портрет.","img":"images/oldtown.jpg"},{"id":"field","s":"primitive","t":"Без назви","m":"Папір, пастель","z":"18×18 см","y":2026,"p":300,"d":"Синє небо, що густішає до ночі, і маленьке село на обрії. Пастель із відчуттям тиші перед світанком.","img":"images/field.jpg"},{"id":"katyusha","s":"primitive","t":"Катюша в ромашковому полі","m":"Холст, олія","z":"40×30 см","y":2025,"p":850,"d":"Реактивна установка серед ромашкового поля. Спокійний пейзаж, у якому війна стала частиною ландшафту.","img":"images/katyusha.jpg"}],"top":["chaos","touch","dusha-2","lifeline-2","hiroshima","conceptualist","robot","abstract-100"],"sales":["dusha-5","lifeline-3","firmova","newhope","sky","indigo","tulipberry","lugar","starychi1","oldtown"],"series":[{"id":"dusha","t":"Душа","text":"Інтроспективне дослідження людської душі. Душу не можна розглянути під мікроскопом чи зважити — єдиним інструментом її пізнання залишається сама людина. Автор тут одночасно дослідник і інструмент: через інтуїцію та живопис він вимірює, систематизує і створює суб'єктивні образи людських душ."},{"id":"lifeline","t":"Lifeline","text":"Одна лінія — одне життя. Абстрактний експресіонізм, що зводить людську історію до мінімальної форми. В основі робіт — історії реальних людей: одні були джерелом натхнення, інші брали участь у створенні своїх картин. Початок, кульмінація і завершення існують одночасно."},{"id":"abstract","t":"Абстрактний експресіонізм","text":"Рух навпаки — від форми до ідеї. Першими з'являються колір, жест, ритм. Назва народжується після завершення твору. Як тест Роршаха, абстракція дає глядачеві побачити не лише картину, а й самого себе. Спроба працювати з хаосом і зловити момент, коли з нього народжується гармонія."},{"id":"mixtape","t":"Mixtape 1 · Смислографія","text":"Збірка концептуальних творів, створених у різний час. Їх об'єднує не сюжет і не стилістика, а метод: від ідеї до форми. Кожна робота — окреме філософське дослідження, а назва — невід'ємна частина композиції. Перший «мікстейп» ідей автора."},{"id":"primitive","t":"Примітивний експресіонізм","text":"Авторський напрям, що виріс із тяжіння до простоти форми. Скільки форми необхідно, щоб передати складний емоційний зміст? Експресія без зайвого — переосмислення традиції експресіонізму через свідоме спрощення."}],"contacts":{"instagram":"thediaryofpainter","telegram":"+380686908175","email":"seekrat436@gmail.com","phone":"+380686908175"},"portfolio":{"v":"2026-10-19"},"texts":{"lead":"Філософія, втілена в мистецтві.","quote":"«Подивись на знайоме\nз нестандартної сторони»","statement":[{"h":"Просто про складне","p":"Суть мого концептуалізму в тому, щоб розповідати складні речі простими словами."},{"h":"Сатира й парадокс","p":"Роботи часто мають сатиричний підтекст, іноді — прямі, навіть цинічні висловлювання про проблеми й парадокси, що стосуються кожного: війна, цінності, пам'ять, віра."},{"h":"Без одного стилю","p":"Від класичного полотна й олії до пастелі, крові на папері, механічних пристроїв та колективного перформансу. Роботи об'єднані методом мислення, а не манерою."}]},"wip":[{"t":"Нова Україна","p":["«Нова Україна» — архітектурний проєкт, присвячений відбудові країни після війни. Проєкт ґрунтується на принципах прагматизму, функціональності сучасної архітектури та практичності, сформованих з урахуванням реалій і досвіду сучасної війни.","У його основі — пошук архітектурних рішень, здатних відповідати не лише потребам мирного життя, а й новим викликам безпеки. У проєкті передбачені технологічні рішення для підвищення обороноздатності міста та системи, спрямовані на захист і безпеку громадян."],"q":"Спроба переосмислити місто майбутнього через досвід війни, де функціональність, технологічність і безпека стають основою нового способу життя."},{"t":"Теорія багатовимірного просторово-часового континууму","p":["Мистецьке втілення філософської теорії, яка виходить з припущення, що наша реальність є лише видимою нам частиною більшої системи вимірів вищих порядків.","Основне припущення теорії полягає в тому, що наш просторо-час (те, що ми називаємо нашим всесвітом) може існувати всередині простору більшої вимірності — ніби кулька в кульці."],"q":"А фундаментальні явища, такі як «плин часу», які ми спостерігаємо у нашій чотиривимірній реальності, можуть бути проявами та наслідком зміни геометрії та руху вимірів вищих порядків."}],"cv":[{"d":"2026","t":"Серії «Душа», «Lifeline», «Примітивний експресіонізм»","s":"Нові роботи, що увійшли до цього каталогу"},{"d":"29.10.2023","t":"«Розп'яті на бордюрах»","s":"Проєкт у міському просторі · м. Конотоп"},{"d":"21.09.2023","t":"«With Love Smirnovich»","s":"Персональна виставка · м. Львів, Intellias Art Point"},{"d":"2021","t":"Початок творчого шляху","s":"Перші роботи серії «Смислографія» та «Душа»"}]}</script>

  const w=()=>track.firstElementChild.offsetWidth||1;
  const wrap=()=>{const W=w();x=((x%W)-W)%W};
  function frame(t){

    if(drag){}

function slap(){

/* ---------- Tumbleweed: now and then one painting rolls across the page like a tumbleweed; click it to open ---------- */
function fxLayer(){let l=$('fx');if(!l){l=document.createElement('div');l.id='fx';document.body.append(l)}return l}
function tumble(){
  if(document.hidden||document.querySelector('dialog[open]')||document.querySelector('.tumble,.tfly')||!W.length)return;
  const w=W[Math.random()*W.length|0], sz=Math.round(Math.min(130,Math.max(80,innerWidth*.09)));
  const ltr=Math.random()<.5, dist=innerWidth+sz*2, dur=Math.max(6000,dist*7);
  const y=innerHeight-sz-40-Math.random()*Math.min(220,innerHeight*.3);
  const el=document.createElement('div');el.className='tumble';el.style.setProperty('--sz',sz+'px');
  el.innerHTML='<div class="hop"><button type="button" class="tb" aria-label="Відкрити «'+esc(w.t)+'»"><img src="'+esc(w.img)+'" alt=""></button>'
    +'<button type="button" class="tclose" aria-label="Прибрати"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2l8 8M10 2L2 10"/></svg></button></div><span class="dust"></span>';
  fxLayer().append(el);
  const tb=el.querySelector('.tb');
  const x0=ltr?-sz*1.5:innerWidth+sz*.5, x1=ltr?innerWidth+sz*.5:-sz*1.5;
  const run=el.animate([{transform:`translate(${x0}px,${y}px)`},{transform:`translate(${x1}px,${y}px)`}],{duration:dur,easing:'linear'});
  const hops=[];const n=5+Math.random()*3|0;
  for(let i=0;i<=n;i++){const up=i%2?-(30+Math.random()*60)*(1-i/n/2):0;hops.push({transform:`translateY(${up}px)`,easing:i%2?'cubic-bezier(.5,0,.8,.5)':'cubic-bezier(.2,.5,.5,1)'})}
  const turns=dist/(Math.PI*sz)*360*(ltr?1:-1);
  const anims=[run,el.querySelector('.hop').animate(hops,{duration:dur,easing:'linear'}),tb.animate([{transform:'rotate(0deg)'},{transform:`rotate(${turns}deg)`}],{duration:dur,easing:'linear'})];
  run.onfinish=()=>el.remove();
  // hover stops it; leaving lets it roll on
  el.addEventListener('mouseenter',()=>anims.forEach(a=>a.pause()));
  el.addEventListener('mouseleave',()=>{if(el.isConnected&&!el.dataset.gone)anims.forEach(a=>a.play())});
  el.querySelector('.tclose').onclick=()=>{
    el.dataset.gone=1; anims.forEach(a=>a.pause());
    el.querySelector('.hop').animate([{opacity:1,transform:getComputedStyle(el.querySelector('.hop')).transform},{opacity:0,transform:'translateY(30px) scale(.4)'}],{duration:350,easing:'ease-in',fill:'forwards'}).onfinish=()=>el.remove();
  };
  tb.onclick=()=>{
    // spin up, grow towards the centre, then open the painting
    el.dataset.gone=1; anims.forEach(a=>a.pause());
    const r=tb.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    const v=(getComputedStyle(tb).transform.match(/matrix\(([^)]+)\)/)||[,'1,0'])[1].split(',').map(Number);
    const ang=Math.atan2(v[1],v[0])*180/Math.PI, end=Math.ceil(ang/360)*360+720;
    const fly=document.createElement('div'); fly.className='tfly'; fly.style.setProperty('--sz',sz+'px');
    fly.style.left=(cx-sz/2)+'px'; fly.style.top=(cy-sz/2)+'px'; fly.innerHTML='<img src="'+esc(w.img)+'" alt="">';
    fxLayer().append(fly); el.remove();
    const s=Math.min(innerWidth,innerHeight)*.6/sz, dx=innerWidth/2-cx, dy=innerHeight/2-cy;
    const a=fly.animate([
      {transform:`translate(0,0) rotate(${ang}deg) scale(1)`},
      {transform:`translate(${dx*.45}px,${dy*.45-50}px) rotate(${(ang+end)/2}deg) scale(${(1+s)/2.4})`,offset:.55},
      {transform:`translate(${dx}px,${dy}px) rotate(${end}deg) scale(${s})`}
    ],{duration:950,easing:'cubic-bezier(.55,0,.2,1)',fill:'forwards'});
    a.onfinish=()=>{openWork(w.id);fly.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'}).onfinish=()=>fly.remove()};
  };
}
{
  const nextTumble=d=>setTimeout(()=>{tumble();nextTumble(22000+Math.random()*23000)},d);
  nextTumble(7000);
}

      +'<div class="adm-sec"><h3>Три тези під першим екраном</h3>'+[0,1,2].map(i=>'<div class="row2"><label for="st-h'+i+'">Заголовок '+(i+1)+'<input id="st-h'+i+'" data-path="texts.statement.'+i+'.h"></label><label for="st-p'+i+'">Текст '+(i+1)+'<textarea id="st-p'+i+'" rows="3" data-path="texts.statement.'+i+'.p"></textarea></label></div>').join('')+'</div>'
      +'<div class="adm-sec" id="wipBox"><div class="head"><h3>Над чим я працюю</h3><button type="button" class="btn sm" id="wAdd">+ Проєкт</button></div>'+draft.wip.map((p,i)=>'<div class="adm-sec" data-i="'+i+'"><div class="head"><b>'+esc(p.t||'Проєкт')+'</b>'+mini(i,draft.wip.length)+'</div><label for="w-t'+i+'">Назва<input id="w-t'+i+'" data-path="wip.'+i+'.t"></label><label for="w-p'+i+'">Текст (абзаци через порожній рядок)<textarea id="w-p'+i+'" rows="6" data-kind="paras" data-path="wip.'+i+'.p"></textarea></label><label for="w-q'+i+'">Виділена думка (курсивом)<textarea id="w-q'+i+'" rows="2" data-path="wip.'+i+'.q"></textarea></label></div>').join('')+(draft.wip.length?'':'<p class="adm-note">Немає проєктів — блок на сайті сховано.</p>')+'</div>'
      +'<div class="adm-sec" id="cvBox"><div class="head"><h3>Виставки та проєкти (CV)</h3><button type="button" class="btn sm" id="cAdd">+ Подія</button></div>'+draft.cv.map((c,i)=>'<div class="adm-sec" data-i="'+i+'"><div class="head"><b>'+esc(c.t||'Подія')+'</b>'+mini(i,draft.cv.length)+'</div><div class="row2"><label for="c-d'+i+'">Дата<input id="c-d'+i+'" data-path="cv.'+i+'.d" placeholder="21.09.2023"></label><label for="c-t'+i+'">Назва<input id="c-t'+i+'" data-path="cv.'+i+'.t"></label></div><label for="c-s'+i+'">Підпис<input id="c-s'+i+'" data-path="cv.'+i+'.s" placeholder="Персональна виставка · місто, місце"></label></div>').join('')+'</div>');
    bindPaths(body);
    bindList($('wipBox'),draft.wip); bindList($('cvBox'),draft.cv);
    $('wAdd').onclick=()=>{draft.wip.push({t:'Новий проєкт',p:[],q:''});touch();drawAdmin()};
    $('cAdd').onclick=()=>{draft.cv.unshift({d:String(new Date().getFullYear()),t:'Нова подія',s:''});touch();drawAdmin()};
  } else if(tab==='contacts'){
    draft.contacts=draft.contacts||{};
    body.innerHTML=wrap('<p class="adm-note">Контакти показуються на першому екрані, у блоці «Поговоримо про мистецтво» і у вікні «Зв’язатися». Порожнє поле — контакт не показується.</p>'
      +'<div class="adm-sec"><label for="k-ig">Instagram (нікнейм або посилання)<input id="k-ig" data-path="contacts.instagram" placeholder="thediaryofpainter"></label>'
      +'<label for="k-tg">Telegram (нікнейм або номер телефону)<input id="k-tg" data-path="contacts.telegram" placeholder="@username або +380…"></label>'
      +'<label for="k-em">Пошта<input id="k-em" type="email" data-path="contacts.email"></label>'
      +'<label for="k-ph">Телефон<input id="k-ph" type="tel" data-path="contacts.phone" placeholder="+380 68 690 81 75"></label></div>'
      +'<p class="adm-note">Заявки з форми приходять на пошту, прив’язану до ключа Web3Forms. Щоб змінити її, потрібен новий ключ — напишіть розробнику.</p>');
    bindPaths(body);
  } else if(tab==='portfolio'){
    body.innerHTML=wrap('<div class="adm-sec"><h3>Портфоліо (PDF)</h3><p class="adm-note">Кнопки «Портфоліо» на сайті відкривають цей файл. Максимальний розмір — 25 МБ (обмеження Cloudflare).</p>'
      +'<a class="btn sm" href="'+esc(PORTFOLIO)+'" target="_blank" rel="noopener" style="align-self:flex-start">Відкрити поточне портфоліо ↗</a>'
      +'<label for="pfFile" class="btn dark sm" style="display:inline-flex;flex-direction:row;align-self:flex-start;color:var(--card);cursor:pointer">'+(pendingPdf?'Вибрати інший файл':'Завантажити новий PDF')+'</label><input type="file" id="pfFile" accept="application/pdf,.pdf" hidden>'
      +'<p id="pfMsg" class="adm-status">'+(pendingPdf?'Новий файл: '+esc(pendingPdf.name)+' ('+(pendingPdf.size/1048576).toFixed(1)+' МБ). Натисніть «Опублікувати на сайті».':'Новий файл не вибрано.')+'</p></div>');
    $('pfFile').onchange=e=>{const file=e.target.files[0];if(!file)return;
      if(!/pdf$/i.test(file.type)&&!/\.pdf$/i.test(file.name)){$('pfMsg').textContent='Це не PDF. Оберіть файл .pdf.';return}
      if(file.size>25*1048576){$('pfMsg').textContent='Файл завеликий ('+(file.size/1048576).toFixed(1)+' МБ). Стисніть його до 25 МБ.';return}

  }
}
function drawAdmin(){
  const body=$('admBody');
  if(['series','texts','contacts','portfolio'].includes(tab))return drawExtra(body);
  if(tab==='works'){
    body.innerHTML=`<div class="adm-list"><button class="btn dark sm" id="admAdd" style="margin:4px 4px 12px">+ Додати роботу</button>
      ${draft.works.map(w=>rowHtml(w,w.id===sel)).join('')}</div><div class="adm-edit" id="admEdit"></div>`;
    drawEditor();
    $('admAdd').onclick=()=>{const id='w'+Date.now().toString(36);
      draft.works.unshift({id,s:COLL_ORDER[0]||'',t:'Нова робота',m:'Холст, олія',z:'',y:String(new Date().getFullYear()),p:0,d:'',img:''});
      sel=id;touch();drawAdmin()};
    body.querySelectorAll('[data-pick]').forEach(bindRow);
    return;
  }
  const ids=draft[tab], isSale=tab==='sales';
  const rest=draft.works.filter(w=>!ids.includes(w.id)&&!(isSale&&w.st==='s'));
  body.innerHTML=`<div class="adm-edit" style="grid-column:1/-1;max-width:820px;width:100%;margin:0 auto">
    <p class="adm-note">${isSale?'Роботи в каруселі Sales. Ціна зі знижкою має бути меншою за звичайну, інакше робота не з’явиться в каруселі. Продані роботи не показуються.':'Роботи в каруселі «Топ робіт», у тому самому порядку, що й на сайті.'}</p>
    <div style="margin-top:18px">${ids.map((id,i)=>{const w=wById(id);if(!w)return'';return `<div class="pick" data-id="${esc(id)}">
      ${w.img?`<img src="${esc(w.img)}" alt="">`:'<span></span>'}
      <div style="min-width:0"><b>${String(i+1).padStart(2,'0')} · ${esc(w.t)}</b><span>Ціна ${w.p?$$(w.p):'—'}${isSale&&w.sale>0&&w.p?` · зі знижкою ${$$(w.sale)} (−${Math.round((1-w.sale/w.p)*100)}%)`:''}</span></div>
      <div class="ctl">${isSale?`<input type="number" min="0" step="10" id="sale-${esc(id)}" value="${w.sale||''}" placeholder="Знижка, $" aria-label="Ціна зі знижкою">`:''}
        <button type="button" data-mv="-1" aria-label="Вище">↑</button><button type="button" data-mv="1" aria-label="Нижче">↓</button><button type="button" data-rm aria-label="Прибрати">✕</button></div></div>`}).join('')||'<p class="adm-note">Поки порожньо. Додайте роботу нижче.</p>'}</div>
    <label for="admAddPick" style="margin-top:22px">Додати роботу<select id="admAddPick"><option value="">Оберіть роботу…</option>${rest.map(w=>`<option value="${esc(w.id)}">${esc(w.t)} — ${w.p?$$(w.p):'без ціни'}</option>`).join('')}</select></label></div>`;
  $('admAddPick').onchange=e=>{const id=e.target.value;if(!id)return;ids.push(id);
    if(isSale){const w=wById(id);if(!(w.sale>0))w.sale=Math.round(w.p*.8/10)*10||0}touch();drawAdmin()};
  body.querySelectorAll('.pick').forEach(row=>{const id=row.dataset.id;
    row.querySelector('[data-rm]').onclick=()=>{ids.splice(ids.indexOf(id),1);touch();drawAdmin()};
    row.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const i=ids.indexOf(id),j=i+ +b.dataset.mv;
      if(j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];touch();drawAdmin()});
    const inp=row.querySelector('input');if(inp)inp.onchange=()=>{const v=Math.max(0,Math.round(+inp.value||0));const w=wById(id);if(v)w.sale=v;else delete w.sale;touch();drawAdmin()};
  });
}

// Real certificate in its own A4 window; the browser's print dialog saves it as PDF.
function printCert(w,owner,date){
  const win=window.open('','_blank'); if(!win)return alert('Дозвольте спливаючі вікна для цього сайту, щоб завантажити сертифікат.');
  const d=date?date.split('-').reverse().join('.'):'';
  win.document.write('<!doctype html><html lang="uk"><head><meta charset="utf-8"><base href="'+esc(location.href)+'"><title>Сертифікат — '+esc(w.t)+' — '+esc(invNo(w))+'</title>'
    +document.querySelector('link[href*="fonts.googleapis"]').outerHTML+'<style>'+$('app-css').textContent
    +'@page{size:A4;margin:0}html,body{background:#fff!important;margin:0;cursor:auto}body{min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}'
    +'.cert{width:178mm;animation:none;box-shadow:none}.cert-in{padding:16mm 14mm;gap:18px}.cert-body img{width:130px;height:130px}.cert-body dl div{font-size:13px}</style></head><body>'
    +certHtml(w,{owner,date:d})+'</body></html>');
  win.document.close();
  const go=()=>Promise.all([win.document.fonts.ready,...[...win.document.images].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>{win.focus();win.print()});
  win.document.readyState==='complete'?go():win.addEventListener('load',go);
}
function drawEditor(){
  const box=$('admEdit'), w=sel&&wById(sel);
  if(!w){box.innerHTML='<p class="adm-note">Оберіть роботу ліворуч, щоб змінити фото, ціну чи опис, або додайте нову.</p>';return}
  const opt=(v,l,c)=>`<option value="${v}"${c===v?' selected':''}>${l}</option>`;
  box.innerHTML=`<form id="admForm" autocomplete="off">
    <div class="adm-photo"><div class="pv">${w.img?`<img src="${esc(w.img)}" alt="">`:'<span class="eyebrow">Немає фото</span>'}</div>
      <div><label for="admFile" class="btn sm" style="display:inline-flex;flex-direction:row;letter-spacing:.2em;color:var(--ink);cursor:pointer">${w.img?'Замінити фото':'Завантажити фото'}</label>
      <input type="file" id="admFile" accept="image/jpeg,image/png,image/webp" hidden>
      <p id="admFileMsg">JPG, PNG або WebP. Фото автоматично зменшиться до 1800 px.</p></div></div>
    <label for="aT">Назва<input id="aT" value="${esc(w.t)}" required></label>
    <div class="adm-grid">
      <label for="aS">Колекція<select id="aS">${COLL_ORDER.map(k=>opt(k,esc(SERIES[k].t),w.s)).join('')}</select></label>
      <label for="aSt">Статус<select id="aSt">${opt('','Доступна',w.st||'')}${opt('r','Резерв',w.st||'')}${opt('s','Продано',w.st||'')}</select></label>
      <label for="aP">Ціна, $<input id="aP" type="number" min="0" step="10" value="${w.p||''}"></label>
      <label for="aSale">Ціна зі знижкою, $<input id="aSale" type="number" min="0" step="10" value="${w.sale||''}" placeholder="Для каруселі Sales"></label>
      <label for="aM">Техніка<input id="aM" value="${esc(w.m)}"></label>
      <label for="aZ">Розмір<input id="aZ" value="${esc(w.z)}" placeholder="50×50 см · диптих: 80×60 та 50×60 см"></label>
      <label for="aY">Рік<input id="aY" value="${esc(w.y)}"></label>
    </div>
    <label for="aD">Опис під картиною<textarea id="aD" rows="6">${esc(w.d)}</textarea></label>
    <fieldset class="adm-cert"><legend>Сертифікат для покупця</legend>
      <div class="adm-grid"><label for="cOwner">Власник (необов'язково)<input id="cOwner" placeholder="Ім'я покупця"></label>
      <label for="cDate">Дата видачі<input id="cDate" type="date" value="${new Date().toISOString().slice(0,10)}"></label></div>
      <button type="button" class="btn sm" id="admCert">Завантажити PDF сертифіката</button>
      <p class="adm-note">Відкриється вікно друку: оберіть «Зберегти як PDF» або одразу принтер.</p></fieldset>
    <div class="adm-actions" id="admActs">
      <span class="adm-status">Зміни одразу видно на сторінці за вікном. Відвідувачі побачать їх після публікації.</span>
      <button type="button" class="btn danger sm" id="admDel">Видалити роботу</button>
    </div></form>`;
  const f=$('admForm');
  f.oninput=e=>{if(e.target.id==='admFile')return;
    Object.assign(w,{t:$('aT').value,s:$('aS').value,st:$('aSt').value,p:Math.max(0,Math.round(+$('aP').value||0)),
      sale:Math.max(0,Math.round(+$('aSale').value||0)),m:$('aM').value,z:$('aZ').value,y:$('aY').value,d:$('aD').value});
    if(!w.st)delete w.st; if(!w.sale)delete w.sale;
    touch();
    const r=$('admBody').querySelector(`[data-pick="${CSS.escape(w.id)}"]`);
    if(r){r.insertAdjacentHTML('afterend',rowHtml(w,true));r.remove();bindRow($('admBody').querySelector(`[data-pick="${CSS.escape(w.id)}"]`))}
  };
  f.onsubmit=e=>e.preventDefault();
  $('admFile').onchange=e=>uploadPhoto(w,e.target.files[0]);
  $('admCert').onclick=()=>printCert(w,$('cOwner').value.trim(),$('cDate').value);
  $('admDel').onclick=()=>{
    if(confirmDel)return; confirmDel=true;
    $('admActs').insertAdjacentHTML('beforeend',`<div class="confirm">Видалити «${esc(w.t)}» з сайту? <button type="button" class="btn danger sm" id="admDelYes">Так, видалити</button><button type="button" class="btn sm" id="admDelNo">Ні</button></div>`);
    $('admDelNo').onclick=()=>{confirmDel=false;drawEditor()};
    $('admDelYes').onclick=()=>{draft.works=draft.works.filter(x=>x.id!==w.id);draft.top=draft.top.filter(x=>x!==w.id);draft.sales=draft.sales.filter(x=>x!==w.id);
      sel=null;confirmDel=false;touch();drawAdmin()};
  };
}

async function shrink(file,max=1800){
  const bmp=await createImageBitmap(file); const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',.86));
}
async function uploadPhoto(w,file){
  if(!file)return; $('admFileMsg').textContent='Завантажую…';
  try{
    const blob=await shrink(file);
    const url=URL.createObjectURL(blob);
    pending.set(url,{path:'images/'+w.id.replace(/[^a-z0-9-]/gi,'')+'-'+Date.now().toString(36)+'.jpg',blob});
    w.img=url;
    touch(); drawEditor(); $('admFileMsg').textContent='Фото завантажено. Не забудьте опублікувати.';
  }catch(err){
    const m={too_large:'Файл завеликий (до 20 МБ).',unsupported_type:'Цей формат не підтримується. Використайте JPG або PNG.',quota_or_state:'Сховище фото заповнене.',rate_limited:'Забагато завантажень поспіль. Спробуйте за хвилину.',not_granted:'Завантаження фото тут недоступне.'}[err?.code];
    $('admFileMsg').textContent=m||'Не вдалося завантажити фото. Спробуйте ще раз.';
  }
}

const b64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(blob)});
async function publishSite(data){
  const out=clone(data), images=[];
  if(pendingPdf){images.push({path:'portfolio.pdf',b64:await b64(pendingPdf)});out.portfolio={v:new Date().toISOString().slice(0,16).replace(/\D/g,'')}}
  for(const w of out.works){const p=pending.get(w.img);if(p){w.img=p.path;if(!images.some(i=>i.path===p.path))images.push({path:p.path,b64:await b64(p.blob)})}}
  await api('publish',{data:out,base:SITE,images});
  return out;
}
$('admSave').onclick=async()=>{
  if(draft.works.some(w=>!w.img)){status('У деяких робіт немає фото. Додайте фото або видаліть ці роботи.',true);return}
  if(!session){status(LOCAL?'Це локальний перегляд: публікація працює лише на сайті.':'Увійдіть з паролем, щоб публікувати.',true);return}
  $('admSave').disabled=true; status('Публікую…');
  try{
    const saved=await publishSite(draft);
    for(const k of pending.keys())URL.revokeObjectURL(k); pending.clear();
    Object.assign(SITE,saved); pendingPdf=null; draft=clone(SITE);
    render(SITE); drawAdmin(); setDirty(false);
    status('Опубліковано. Сайт оновиться приблизно за 1–2 хвилини.');
  }catch(err){
    if(err.status===401){setTok(null);session=null}
    status(err.status===409?'Сайт уже змінили з іншого місця. Оновіть сторінку й внесіть зміни ще раз.'
      :err.status===401?'Сеанс завершився. Натисніть «Вийти» й увійдіть з паролем ще раз.'
      :err.code==='github_token'?'Ключ GitHub у налаштуваннях Cloudflare не діє або не має доступу до репозиторію.'
      :err.code==='not_configured'?'Адмінку ще не налаштовано в Cloudflare.'
      :err.code==='conflict'?'GitHub не прийняв зміни. Оновіть сторінку й спробуйте ще раз.'
      :'Не вдалося опублікувати. Перевірте інтернет і спробуйте ще раз.',true);
    $('admSave').disabled=false;
  }
};
